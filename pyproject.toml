[project]
name = "stockfilter"
version = "0.1.0"
description = "美股与 A 股长牛价值硬条件筛选器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.17,<2",
  "duckdb>=1.1,<2",
  "pandas>=2.0,<3",
  "plotly>=5.20,<7",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "streamlit>=1.50,<2",
  "yfinance>=0.2.66,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
stockfilter = "stockfilter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockfilter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
